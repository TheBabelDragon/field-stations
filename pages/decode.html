<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080812" />
  <title>FIELD STATION decoder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="decode">
  <video id="stage" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="loop-banner" hidden>RAW MATCH</div>

  <header class="hud">
    <p class="kicker">FIELD STATION <span id="station-label">----</span></p>
    <p class="lede" id="mode-label">optical receiver</p>
  </header>

  <aside class="hud">
    <h2 id="listen-state">TAP CAMERA</h2>
    <div class="meter">Signal<div class="bar"><i id="sig-bar"></i></div></div>
    <div class="meter">Contrast<div class="bar"><i id="con-bar"></i></div></div>
    <canvas id="wave" width="240" height="36"></canvas>
    <div class="meter" id="raw-line">RAW —</div>
    <div class="meter" id="sync-line">Clock —</div>
    <div class="meter" id="frame-line">Symbol —</div>
    <div class="recovered">
      <p class="kicker">SEEN</p>
      <pre id="rec-body">none yet</pre>
    </div>
    <p class="status dim" id="diag">lock the bright disc</p>
    <div class="log" id="log"></div>
  </aside>

  <div class="hud-bar">
    <button type="button" id="cam" class="primary">CAMERA</button>
    <button type="button" id="clear">CLEAR</button>
  </div>

  <footer class="hud">
    <a href="tx.html?station=7F29&amp;sym=67&amp;stage=1&amp;period=120">transmitter</a>
    <span id="footer-note">RAW first</span>
  </footer>

  <script type="module" src="decoder.js"></script>
</body>
</html>
